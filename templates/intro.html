<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>自介desu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 背景漸層 */
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #1a1a40, #330000);
            color: #ffffff;
        }

        /* Intro 區塊 */
        .intro-box {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            font-size: 20px;
            line-height: 1.9;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .intro-box:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(255, 200, 0, 0.6);
        }

        /* 標題 */
        .intro-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffaa00;
        }

        /* 強調角色語氣 */
        .highlight {
            color: #ff6666;
            font-weight: bold;
        }

        /* 按鈕 */
        .back-button {
            display: block;
            margin: 40px auto 0;
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .back-button:hover {
            background: #ffaa00;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="intro-box">
        <div class="intro-title"></div>
        <p>
            <span class="highlight">火花</span>的毀滅感在程式裡燃燒，<br>
            <span class="highlight">花火</span>的不在乎讓我敢隨性創作，<br>
            <span class="highlight">銀狼</span>的從容是我在鍵盤後的冷靜，<br>
            <span class="highlight">亂破</span>的衝勁就像我寫程式先衝再說，<br>

        <h5><del>中二病(?</del></h5>
        </p>
        <button class="back-button" onclick="window.location.href='/list'">回去</button>
    </div>
</body>

</html>
