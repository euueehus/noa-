<!DOCTYPE html>
<html lang="zh-TW">
<title>Noa的Kards小站</title>

<style>
    :root {
        --bg: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        --surface: rgba(17, 17, 17, 0.9);
        --card: rgba(22, 22, 22, 0.85);
        --border: #2a2a2a;
        --accent: #c8f542;
        --accent2: #42f5c8;
        --text: #e8e8e8;
        --muted: #888;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: var(--bg);
        font-family: 'Noto Sans TC', sans-serif;
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    header {
        position: relative;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        z-index: 10;
    }

    header::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .header-title {
        font-family: 'Space Mono', monospace;
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-shadow: 0 0 6px var(--accent);
    }

    .container {
        max-width: 860px;
        margin: 48px auto;
        padding: 0 24px;
        position: relative;
        z-index: 1;
        margin-bottom: 100px;
    }

    .section-label {
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .project {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px 28px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        transition: all 0.3s ease;
        animation: fadeUp 0.5s ease both;
        backdrop-filter: blur(8px);
    }

    .project:last-child {
        margin-bottom: 80px;
    }

    .project:nth-child(2) {
        animation-delay: 0.1s;
    }

    .project:nth-child(3) {
        animation-delay: 0.2s;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .project:hover {
        border-color: var(--accent);
        transform: translateY(-5px) scale(1.015);
        box-shadow: 0 0 28px rgba(200, 245, 66, 0.18),
            0 0 40px rgba(66, 245, 200, 0.12);
    }

    .project-left {
        display: flex;
        align-items: center;
        gap: 18px;
        flex: 1;
    }

    .project-index {
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        color: var(--muted);
        width: 32px;
        flex-shrink: 0;
        font-weight: 700;
    }

    .project-info h2 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 4px;
    }

    .project-info .note {
        font-size: 13px;
        color: var(--muted);
        font-family: 'Space Mono', monospace;
    }

    /* 標籤優化（重點） */
    .tag {
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 6px 16px;
        border-radius: 9999px;
        background: rgba(200, 245, 66, 0.08);
        color: var(--accent);
        border: 1px solid rgba(200, 245, 66, 0.35);
        box-shadow: 0 0 12px rgba(200, 245, 66, 0.25);
        white-space: nowrap;
        transition: all 0.4s ease;
    }

    .tag:hover {
        background: rgba(200, 245, 66, 0.15);
        box-shadow: 0 0 18px rgba(200, 245, 66, 0.4);
        transform: translateY(-1px);
    }

    .tag.us {
        color: var(--accent);
        border-color: rgba(200, 245, 66, 0.5);
        box-shadow: 0 0 14px rgba(200, 245, 66, 0.35);
    }

    .tag.uk {
        background: rgba(66, 245, 200, 0.08);
        color: var(--accent2);
        border-color: rgba(66, 245, 200, 0.5);
        box-shadow: 0 0 14px rgba(66, 245, 200, 0.35);
    }

    .project-right {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
    }

    .btn {
        font-family: 'Space Mono', monospace;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 10px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
        background-size: 200% 100%;
        background-position: left center;
    }

    .btn:hover {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-color: transparent;
        color: #000;
        background-position: right center;
        transform: translateY(-1px);
    }
</style>
</head>
<header>
    <img src="/static/c_logo.jpg" alt="logo"
        style="width:42px; height:42px; border-radius:8px; border:1px solid var(--border);">
    <span class="header-title">kards~</span>
</header>

<body>
    <div class=container>
        <div class="section-label">美國卡組列表</div>
        <div class="project">
            <div class="project-left">
                <span class="project-index">01</span>
                <div class="project-info">
                    <h2>美國高油</h2>
                    <p class="note">US Kards Deck</p>
                </div>
            </div>
            <div class="project-right">
                <span class="tag us">美國高油</span>
                <button class="btn" onclick="location.href='/Kards_us_high'">前往 →</button>
            </div>
        </div>

        <div class="project">
            <div class="project-left">
                <span class="project-index">02</span>
                <div class="project-info">
                    <h2>很多解牌</h2>
                    <p class="note">UK Kards Deck</p>
                </div>
            </div>
            <div class="project-right">
                <span class="tag uk">解牌</span>
                <button class="btn" onclick="location.href='/Kards_us_many'">前往 →</button>
            </div>
        </div>

        <div class="project">
            <div class="project-left">
                <span class="project-index">03</span>
                <div class="project-info">
                    <h2>返回列表</h2>
                </div>
            </div>
            <div class="project-right">
                <button class="btn" onclick="window.location.href='/list'">回去</button>
            </div>
        </div>
    </div>5


</body>

</html>
