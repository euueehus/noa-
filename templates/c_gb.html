<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Roulette</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Courier+Prime:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #080608;
            --s1: #0f0d0f;
            --s2: #161218;
            --s3: #1e1820;
            --brd: #2e2430;
            --brd2: #4a3850;
            --crimson: #8b1a1a;
            --crim2: #c0392b;
            --crim3: #e74c3c;
            --gold: #8a6a1a;
            --gold2: #c9954a;
            --gold3: #e8c97a;
            --silver: #4a4450;
            --silver2: #7a7088;
            --silver3: #b0a8c0;
            --text: #d8d0e8;
            --text2: #9088a0;
            --text3: #5a5068;
            --cp: 'Courier Prime', monospace;
            --pf: 'Playfair Display', serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg)
        }

        body {
            color: var(--text);
            font-family: var(--cp);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative
        }

        /* scanline */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.07) 2px, rgba(0, 0, 0, 0.07) 4px);
            pointer-events: none;
            z-index: 200
        }

        /* vignette */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 1
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0
        }

        /* ═══ HEADER ═══ */
        .hdr {
            text-align: center;
            padding: 20px 0 24px;
            position: relative
        }

        .hdr-sub {
            font-family: var(--cp);
            font-size: 9px;
            letter-spacing: 6px;
            color: var(--text3);
            text-transform: uppercase;
            margin-bottom: 10px
        }

        .hdr-title {
            font-family: var(--pf);
            font-style: italic;
            font-size: clamp(28px, 7vw, 46px);
            color: var(--text);
            line-height: 1;
            letter-spacing: 1px
        }

        .hdr-title em {
            color: var(--crim3);
            font-style: normal
        }

        .hdr-line {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brd2), transparent);
            margin: 14px auto 0
        }

        /* ═══ STATS BAR ═══ */
        .stats-bar {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0;
            margin-bottom: 28px;
            position: relative
        }

        .stat-block {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .stat-block.right {
            align-items: flex-end
        }

        .stat-lbl {
            font-size: 8px;
            letter-spacing: 3px;
            color: var(--text3);
            text-transform: uppercase
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold3);
            line-height: 1
        }

        .stat-val.danger {
            color: var(--crim3)
        }

        .stat-sep {
            width: 1px;
            height: 40px;
            background: var(--brd);
            margin: 0 16px
        }

        /* lives */
        .lives-row {
            display: flex;
            gap: 4px
        }

        .life {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--crim2);
            box-shadow: 0 0 5px var(--crim2);
            transition: all 0.4s
        }

        .life.gone {
            background: var(--brd);
            box-shadow: none;
            opacity: 0.3
        }

        /* ═══ REVOLVER SVG ═══ */
        .gun-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            position: relative
        }

        #revolverSvg {
            width: min(380px, 90vw);
            height: auto;
            filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.8))
        }

        .chamber-label {
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--text3);
            text-transform: uppercase;
            margin-top: 8px
        }

        /* ═══ TENSION METER ═══ */
        .tension-wrap {
            width: 100%;
            margin-bottom: 24px;
            position: relative
        }

        .tension-bar-bg {
            height: 3px;
            background: var(--brd);
            border-radius: 2px;
            overflow: hidden
        }

        .tension-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold2), var(--crim2), var(--crim3));
            border-radius: 2px;
            transition: width 0.6s ease;
            width: 0%
        }

        .tension-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px
        }

        .tension-lbl {
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--text3)
        }

        .tension-val {
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--crim2)
        }

        /* ═══ ACTION CARD ═══ */
        .action-card {
            width: 100%;
            background: var(--s1);
            border: 1px solid var(--brd);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brd2), transparent)
        }

        .ac-title {
            font-size: 8px;
            letter-spacing: 4px;
            color: var(--text3);
            text-transform: uppercase;
            margin-bottom: 14px
        }

        /* bet area */
        .bet-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center
        }

        .chip {
            background: var(--s2);
            border: 1px solid var(--brd);
            border-radius: 3px;
            color: var(--gold2);
            font-family: var(--cp);
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 1px
        }

        .chip:hover {
            border-color: var(--gold2);
            color: var(--gold3);
            background: rgba(138, 106, 26, 0.12)
        }

        .chip:active {
            transform: scale(0.96)
        }

        .chip.all-in {
            border-color: var(--crim2);
            color: var(--crim3)
        }

        .chip.all-in:hover {
            background: rgba(139, 26, 26, 0.15)
        }

        .bet-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold3);
            padding: 6px 16px;
            border: 1px solid var(--gold);
            border-radius: 3px;
            min-width: 80px;
            text-align: center;
            letter-spacing: 2px
        }

        .bet-x {
            background: transparent;
            border: 1px solid var(--brd);
            border-radius: 3px;
            color: var(--text3);
            font-family: var(--cp);
            font-size: 10px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.15s
        }

        .bet-x:hover {
            color: var(--text2);
            border-color: var(--brd2)
        }

        .divider-line {
            width: 100%;
            height: 1px;
            background: var(--brd);
            margin: 16px 0
        }

        /* items */
        .items-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .item-btn {
            background: var(--s2);
            border: 1px solid var(--brd);
            border-radius: 3px;
            color: var(--text2);
            font-family: var(--cp);
            font-size: 9px;
            letter-spacing: 1px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 68px;
            position: relative
        }

        .item-btn:hover:not(:disabled) {
            border-color: var(--brd2);
            color: var(--silver3)
        }

        .item-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed
        }

        .item-icon {
            font-size: 14px;
            line-height: 1
        }

        .item-name {
            font-size: 8px;
            letter-spacing: 1px
        }

        .item-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--crimson);
            color: var(--crim3);
            font-size: 7px;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--crim2)
        }

        /* ═══ FIRE BUTTON ═══ */
        .fire-wrap {
            width: 100%;
            margin-bottom: 16px;
            position: relative
        }

        .fire-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--crimson);
            border-radius: 3px;
            color: var(--crim2);
            font-family: var(--pf);
            font-style: italic;
            font-size: 18px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden
        }

        .fire-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--crimson);
            opacity: 0;
            transition: opacity 0.2s
        }

        .fire-btn:hover::before {
            opacity: 0.15
        }

        .fire-btn:hover {
            border-color: var(--crim2);
            color: var(--crim3);
            box-shadow: 0 0 30px rgba(139, 26, 26, 0.3)
        }

        .fire-btn:active {
            transform: scale(0.99)
        }

        .fire-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed
        }

        .fire-btn span {
            position: relative;
            z-index: 1
        }

        .pass-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--brd);
            border-radius: 3px;
            color: var(--text3);
            font-family: var(--cp);
            font-size: 10px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 8px;
            text-transform: uppercase
        }

        .pass-btn:hover {
            border-color: var(--brd2);
            color: var(--text2)
        }

        .pass-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed
        }

        /* ═══ LOG ═══ */
        .log-card {
            width: 100%;
            background: var(--s1);
            border: 1px solid var(--brd);
            border-radius: 3px;
            padding: 14px 16px;
            max-height: 160px;
            overflow-y: auto
        }

        .log-card::-webkit-scrollbar {
            width: 3px
        }

        .log-card::-webkit-scrollbar-thumb {
            background: var(--brd2)
        }

        .log-entry {
            font-size: 11px;
            line-height: 1.8;
            color: var(--text3);
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03)
        }

        .log-entry:last-child {
            border-bottom: none
        }

        .log-entry.hit {
            color: var(--crim3)
        }

        .log-entry.safe {
            color: var(--gold2)
        }

        .log-entry.ai {
            color: var(--silver2)
        }

        .log-entry.sys {
            color: var(--text3);
            font-style: italic
        }

        .log-entry.item {
            color: var(--silver3)
        }

        .log-entry.big {
            color: var(--crim3);
            font-weight: 700
        }

        /* ═══ AI STATUS ═══ */
        .ai-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            margin-bottom: 4px
        }

        .ai-name {
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--text3);
            text-transform: uppercase
        }

        .ai-mood {
            font-size: 11px;
            color: var(--silver2);
            font-style: italic;
            font-family: var(--pf)
        }

        .ai-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--crim2);
            box-shadow: 0 0 6px var(--crim2);
            animation: pulse 2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        /* ═══ MODALS ═══ */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            flex-direction: column;
            gap: 0
        }

        .modal-bg.show {
            display: flex
        }

        .modal {
            background: var(--s1);
            border: 1px solid var(--brd2);
            border-radius: 4px;
            padding: 36px 40px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            position: relative
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brd2), transparent)
        }

        .modal-eyebrow {
            font-size: 8px;
            letter-spacing: 5px;
            color: var(--text3);
            text-transform: uppercase;
            margin-bottom: 12px
        }

        .modal-title {
            font-family: var(--pf);
            font-size: 28px;
            color: var(--text);
            margin-bottom: 6px
        }

        .modal-title.red {
            color: var(--crim3)
        }

        .modal-title.gold {
            color: var(--gold3)
        }

        .modal-sub {
            font-size: 12px;
            color: var(--text2);
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-style: italic;
            font-family: var(--pf)
        }

        .modal-stat {
            font-size: 18px;
            color: var(--gold3);
            font-family: var(--cp);
            margin-bottom: 28px;
            letter-spacing: 3px
        }

        .modal-btn {
            background: transparent;
            border: 1px solid var(--brd2);
            border-radius: 3px;
            color: var(--text2);
            font-family: var(--cp);
            font-size: 10px;
            letter-spacing: 4px;
            padding: 12px 32px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase
        }

        .modal-btn:hover {
            border-color: var(--gold2);
            color: var(--gold3)
        }

        .modal-btn.danger {
            border-color: var(--crimson);
            color: var(--crim2)
        }

        .modal-btn.danger:hover {
            border-color: var(--crim3);
            color: var(--crim3)
        }

        /* peek result */
        .peek-icon {
            font-size: 48px;
            margin: 10px 0 6px
        }

        .peek-desc {
            font-size: 13px;
            font-family: var(--pf);
            font-style: italic;
            color: var(--text2);
            margin-bottom: 20px
        }

        /* screen flash */
        @keyframes flashRed {
            0% {
                background: rgba(139, 26, 26, 0.3)
            }

            100% {
                background: transparent
            }
        }

        @keyframes flashGold {
            0% {
                background: rgba(138, 106, 26, 0.2)
            }

            100% {
                background: transparent
            }
        }

        .flash-red {
            animation: flashRed 0.5s ease-out
        }

        .flash-gold {
            animation: flashGold 0.4s ease-out
        }

        /* gun chamber indicators */
        .cham-indicator {
            display: flex;
            gap: 6px;
            margin-top: 6px
        }

        .cind {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--brd2);
            background: transparent;
            transition: all 0.3s;
            position: relative
        }

        .cind.loaded {
            border-color: var(--crim2);
            background: rgba(139, 26, 26, 0.4)
        }

        .cind.fired-safe {
            border-color: var(--brd);
            opacity: 0.3
        }

        .cind.fired-hit {
            border-color: var(--crim2);
            background: var(--crimson);
            opacity: 0.5
        }

        .cind.current {
            border-color: var(--gold2);
            box-shadow: 0 0 8px rgba(201, 149, 74, 0.5)
        }

        .cind.mystery {
            border-color: var(--brd2)
        }

        /* round badge */
        .round-badge {
            font-size: 8px;
            letter-spacing: 4px;
            color: var(--text3);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 16px
        }
    </style>
</head>

<body>
    <div class="scene">

        <div class="hdr">
            <div class="hdr-sub">Single Player</div>
            <div class="hdr-title"><em>Russian</em> Roulette</div>
            <div class="hdr-line"></div>
        </div>

        <!-- stats -->
        <div class="stats-bar">
            <div class="stat-block">
                <div class="stat-lbl">你的籌碼</div>
                <div class="stat-val" id="myChips">500</div>
                <div class="lives-row" id="myLives"></div>
            </div>
            <div class="stat-sep"></div>
            <div class="stat-block right">
                <div class="stat-lbl">莊家籌碼</div>
                <div class="stat-val" id="aiChips">500</div>
                <div class="lives-row" id="aiLives" style="justify-content:flex-end"></div>
            </div>
        </div>

        <div class="round-badge" id="roundBadge">Round 1 — 1 bullet / 6 chambers</div>

        <!-- revolver viz -->
        <div class="gun-wrap">
            <svg id="revolverSvg" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
                <!-- gun body -->
                <g opacity="0.9">
                    <!-- barrel -->
                    <rect x="170" y="96" width="140" height="22" rx="4" fill="#1a1520" stroke="#3a2e48"
                        stroke-width="1" />
                    <rect x="290" y="98" width="28" height="18" rx="2" fill="#120f18" stroke="#2e2438"
                        stroke-width="1" />
                    <!-- cylinder -->
                    <circle cx="148" cy="115" r="40" fill="#0f0d15" stroke="#2e2438" stroke-width="1.5" />
                    <circle cx="148" cy="115" r="32" fill="#0a0810" stroke="#1e1828" stroke-width="1" />
                    <!-- grip -->
                    <path d="M165 120 L172 185 Q168 192 158 192 L148 192 Q138 192 136 182 L140 120 Z" fill="#150f10"
                        stroke="#2e2030" stroke-width="1" />
                    <path d="M155 130 L160 180 L150 180 L147 130 Z" fill="#1a1215" opacity="0.5" />
                    <!-- trigger guard -->
                    <path d="M155 138 Q155 162 165 162 L180 162 Q185 155 185 148 L178 135" fill="none" stroke="#2e2438"
                        stroke-width="1.5" />
                    <!-- trigger -->
                    <line x1="165" y1="138" x2="168" y2="158" stroke="#3e3450" stroke-width="2"
                        stroke-linecap="round" />
                    <!-- hammer -->
                    <path d="M163 96 L156 80 L164 78 L172 96" fill="#1a1520" stroke="#3a2e48" stroke-width="1" />
                </g>
                <!-- chambers (6) -->
                <g id="svgChambers"></g>
                <!-- muzzle flash (hidden) -->
                <g id="muzzleFlash" opacity="0" transform="translate(318,107)">
                    <polygon points="0,0 10,-8 6,0 10,8" fill="#e74c3c" opacity="0.9" />
                    <polygon points="0,0 14,-4 8,0 14,4" fill="#c0392b" opacity="0.7" />
                    <polygon points="0,0 8,-12 4,0" fill="#ff6b35" opacity="0.6" />
                    <polygon points="0,0 8,12 4,0" fill="#ff6b35" opacity="0.6" />
                </g>
            </svg>
            <div class="cham-indicator" id="chamIndicator"></div>
            <div class="chamber-label" id="chamLabel">滾輪就緒</div>
        </div>

        <!-- tension -->
        <div class="tension-wrap">
            <div class="tension-bar-bg">
                <div class="tension-bar-fill" id="tensionFill"></div>
            </div>
            <div class="tension-labels">
                <span class="tension-lbl">緊張程度</span>
                <span class="tension-val" id="tensionPct">0%</span>
            </div>
        </div>

        <!-- ai status -->
        <div class="ai-row">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="ai-status-dot"></div>
                <div class="ai-name">莊家 AI</div>
            </div>
            <div class="ai-mood" id="aiMood">平靜地凝視著你</div>
        </div>

        <!-- action card -->
        <div class="action-card">
            <div class="ac-title">下注籌碼</div>
            <div class="bet-area">
                <button class="chip" onclick="addBet(10)">10</button>
                <button class="chip" onclick="addBet(25)">25</button>
                <button class="chip" onclick="addBet(50)">50</button>
                <button class="chip" onclick="addBet(100)">100</button>
                <button class="chip" onclick="addBet(250)">250</button>
                <button class="chip all-in" onclick="allIn()">全押</button>
                <div class="bet-val" id="betVal">0</div>
                <button class="bet-x" onclick="clearBet()">✕</button>
            </div>
            <div class="divider-line"></div>
            <div class="ac-title">特殊道具</div>
            <div class="items-row">
                <button class="item-btn" id="itemPeek" onclick="usePeek()">
                    <span class="item-icon">🔍</span>
                    <span class="item-name">窺探</span>
                    <span style="font-size:7px;color:var(--text3)">看下格</span>
                </button>
                <button class="item-btn" id="itemSpin" onclick="useSpin()">
                    <span class="item-icon">🌀</span>
                    <span class="item-name">重轉</span>
                    <span style="font-size:7px;color:var(--text3)">洗牌槍膛</span>
                </button>
                <button class="item-btn" id="itemSkip" onclick="useSkip()">
                    <span class="item-icon">⏭</span>
                    <span class="item-name">轉移</span>
                    <span style="font-size:7px;color:var(--text3)">AI先開槍</span>
                </button>
                <button class="item-btn" id="itemDouble" onclick="useDouble()">
                    <span class="item-icon">×2</span>
                    <span class="item-name">加倍</span>
                    <span style="font-size:7px;color:var(--text3)">賭注翻倍</span>
                </button>
                <button class="item-btn" id="itemShield" onclick="useShield()">
                    <span class="item-icon">🛡</span>
                    <span class="item-name">護盾</span>
                    <span style="font-size:7px;color:var(--text3)">免死一次</span>
                </button>
            </div>
        </div>

        <!-- fire -->
        <div class="fire-wrap">
            <button class="fire-btn" id="fireBtn" onclick="playerFire()"><span>扣下扳機</span></button>
            <button class="pass-btn" id="passBtn" onclick="playerPass()">讓莊家開槍（Pass）</button>
        </div>

        <!-- log -->
        <div class="log-card" id="logEl">
            <div class="log-entry sys">— 遊戲開始。你先手。—</div>
        </div>

    </div>

    <!-- peek modal -->
    <div class="modal-bg" id="peekModal">
        <div class="modal">
            <div class="modal-eyebrow">窺探結果</div>
            <div class="peek-icon" id="peekIcon">🟢</div>
            <div class="modal-title" id="peekTitle">空包彈</div>
            <div class="peek-desc" id="peekDesc">下一格是空的——但命運難料。</div>
            <button class="modal-btn" onclick="closeModal('peekModal')">了解</button>
        </div>
    </div>

    <!-- result modal -->
    <div class="modal-bg" id="resultModal">
        <div class="modal">
            <div class="modal-eyebrow" id="resultEyebrow">GAME OVER</div>
            <div class="modal-title" id="resultTitle">你贏了</div>
            <div class="modal-sub" id="resultSub">莊家的運氣用盡</div>
            <div class="modal-stat" id="resultStat">+250 籌碼</div>
            <button class="modal-btn" onclick="restart()">再來一局</button>
        </div>
    </div>

    <script>
        const CHAMBERS = 6, START = 500, LIVES = 3;
        const AI_MOODS_CALM = ["平靜地凝視著你", "輕蔑地微笑", "手指在桌上輕扣", "吐出一口煙", "沉默地等待", "將籌碼推向中央"];
        const AI_MOODS_TENSE = ["眼神變得銳利", "額頭微微滲汗", "緊握著椅背", "深呼吸一口氣", "舔了舔嘴唇", "瞳孔微微放大"];
        const AI_MOODS_HIGH = ["手微微顫抖", "牙關緊咬", "眼中閃過一絲恐懼", "喃喃自語", "緊盯著槍管"];

        let G = {};

        function init() {
            G = {
                myChips: START, aiChips: START,
                myLives: LIVES, aiLives: LIVES,
                bet: 0, doubled: false, shielded: false,
                turn: 'player', // 'player' or 'ai'
                items: { peek: 1, spin: 1, skip: 1, double: 1, shield: 1 },
                chambers: [], pointer: 0, round: 1,
                aiItems: { peek: 1, spin: 1 },
                gameOver: false,
            };
            loadGun();
            renderAll();
            updateMood();
        }

        function loadGun() {
            G.chambers = Array(CHAMBERS).fill(false);
            const bullets = Math.min(1 + Math.floor(G.round / 2), 4);
            let p = 0;
            while (p < bullets) { const i = Math.floor(Math.random() * CHAMBERS); if (!G.chambers[i]) { G.chambers[i] = true; p++; } }
            G.pointer = 0;
            const b = G.chambers.filter(Boolean).length;
            document.getElementById('roundBadge').textContent = `Round ${G.round} — ${b} bullet${b > 1 ? 's' : ''} / ${CHAMBERS} chambers`;
            log(`— 第 ${G.round} 輪：裝填 ${b} 發子彈，轉動滾輪。—`, 'sys');
            updateTension();
        }

        function updateTension() {
            const remaining = CHAMBERS - G.pointer;
            const loaded = G.chambers.slice(G.pointer).filter(Boolean).length;
            const pct = remaining > 0 ? Math.round(loaded / remaining * 100) : 0;
            document.getElementById('tensionFill').style.width = pct + '%';
            document.getElementById('tensionPct').textContent = pct + '%';
        }

        function updateMood() {
            const remaining = CHAMBERS - G.pointer;
            const loaded = G.chambers.slice(G.pointer).filter(Boolean).length;
            const pct = remaining > 0 ? loaded / remaining : 0;
            let pool = pct > 0.5 ? AI_MOODS_HIGH : pct > 0.25 ? AI_MOODS_TENSE : AI_MOODS_CALM;
            document.getElementById('aiMood').textContent = pool[Math.floor(Math.random() * pool.length)];
        }

        function renderAll() {
            document.getElementById('myChips').textContent = G.myChips;
            document.getElementById('aiChips').textContent = G.aiChips;
            document.getElementById('betVal').textContent = G.bet;

            // lives
            for (let p of ['my', 'ai']) {
                const el = document.getElementById(p + 'Lives');
                el.innerHTML = '';
                const lives = p === 'my' ? G.myLives : G.aiLives;
                for (let i = 0; i < LIVES; i++) {
                    const d = document.createElement('div');
                    d.className = 'life' + (i >= lives ? ' gone' : '');
                    el.appendChild(d);
                }
            }

            // items
            const imap = { itemPeek: 'peek', itemSpin: 'spin', itemSkip: 'skip', itemDouble: 'double', itemShield: 'shield' };
            for (const [id, key] of Object.entries(imap)) {
                const btn = document.getElementById(id);
                btn.disabled = !G.items[key] || G.turn !== 'player' || G.gameOver;
            }

            // buttons
            document.getElementById('fireBtn').disabled = G.turn !== 'player' || G.gameOver;
            document.getElementById('passBtn').disabled = G.turn !== 'player' || G.gameOver;

            // SVG chambers
            renderSVGChambers();
            renderChamberIndicators();
            updateTension();
        }

        function renderSVGChambers() {
            const svg = document.getElementById('svgChambers');
            svg.innerHTML = '';
            const cx = 148, cy = 115, r = 22;
            for (let i = 0; i < CHAMBERS; i++) {
                const angle = (i / CHAMBERS) * Math.PI * 2 - Math.PI / 2;
                const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
                const isLoaded = G.chambers[i];
                const isCurrent = i === G.pointer;
                const isFired = i < G.pointer;
                let fill = '#0a0810', stroke = '#2e2438';
                if (isFired && isLoaded) { fill = '#3a0808'; stroke = '#8b1a1a'; }
                else if (isFired && !isLoaded) { fill = '#0a0810'; stroke = '#1e1828'; opacity = 0.4; }
                else if (isCurrent) { stroke = '#8a6a1a'; }
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x); circle.setAttribute('cy', y);
                circle.setAttribute('r', 6);
                circle.setAttribute('fill', fill); circle.setAttribute('stroke', stroke);
                circle.setAttribute('stroke-width', isCurrent ? 1.5 : 1);
                if (isCurrent) { circle.setAttribute('filter', ''); }
                svg.appendChild(circle);
                if (!isFired && isLoaded && i === G.pointer) {
                    // show loaded indicator for current if player peeked
                }
                if (isCurrent) {
                    const ind = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    ind.setAttribute('cx', x); ind.setAttribute('cy', y);
                    ind.setAttribute('r', 3); ind.setAttribute('fill', '#8a6a1a');
                    svg.appendChild(ind);
                }
            }
        }

        function renderChamberIndicators() {
            const row = document.getElementById('chamIndicator');
            row.innerHTML = '';
            G.chambers.forEach((loaded, i) => {
                const d = document.createElement('div');
                let cls = 'cind';
                if (i < G.pointer) { cls += loaded ? ' fired-hit' : ' fired-safe'; }
                else if (i === G.pointer) { cls += ' current'; }
                else { cls += ' mystery'; }
                d.className = cls;
                row.appendChild(d);
            });
            document.getElementById('chamLabel').textContent =
                `格 ${G.pointer + 1}/${CHAMBERS} — ${G.chambers.filter(Boolean).length} 發子彈剩餘`;
        }

        /* ── BETTING ── */
        function addBet(n) {
            if (G.turn !== 'player' || G.gameOver) return;
            G.bet = Math.min(G.bet + n, G.myChips);
            renderAll();
        }
        function allIn() { G.bet = G.myChips; renderAll(); }
        function clearBet() { G.bet = 0; G.doubled = false; renderAll(); }

        /* ── ITEMS ── */
        function usePeek() {
            if (!G.items.peek || G.turn !== 'player') return;
            G.items.peek = 0;
            const hit = G.chambers[G.pointer];
            document.getElementById('peekIcon').textContent = hit ? '🔴' : '🟢';
            document.getElementById('peekTitle').textContent = hit ? '子彈！' : '空包彈';
            document.getElementById('peekTitle').className = 'modal-title ' + (hit ? 'red' : 'gold');
            document.getElementById('peekDesc').textContent = hit ? '下一格裝有子彈——謹慎決策。' : '下一格是空的——但之後呢？';
            document.getElementById('peekModal').classList.add('show');
            log('🔍 你窺探了下一格。', 'item');
            renderAll();
        }

        function useSpin() {
            if (!G.items.spin || G.turn !== 'player') return;
            G.items.spin = 0;
            const remaining = CHAMBERS - G.pointer;
            const toPlace = Math.max(1, Math.floor(remaining * 0.3));
            for (let i = G.pointer; i < CHAMBERS; i++)G.chambers[i] = false;
            let p = 0;
            while (p < toPlace) {
                const i = G.pointer + Math.floor(Math.random() * remaining);
                if (!G.chambers[i]) { G.chambers[i] = true; p++; }
            }
            log('🌀 你重轉了槍膛——命運重置。', 'item');
            renderAll();
        }

        function useSkip() {
            if (!G.items.skip || G.turn !== 'player') return;
            G.items.skip = 0;
            log('⏭ 你把槍轉向了莊家——他先開槍。', 'item');
            G.turn = 'ai';
            renderAll();
            setTimeout(aiTurn, 1200);
        }

        function useDouble() {
            if (!G.items.double || G.turn !== 'player') return;
            G.items.double = 0;
            G.doubled = true;
            log('×2 加倍道具啟動——本輪賭注翻倍！', 'item');
            renderAll();
        }

        function useShield() {
            if (!G.items.shield || G.turn !== 'player') return;
            G.items.shield = 0;
            G.shielded = true;
            log('🛡 護盾啟動——下一次中彈將被抵消。', 'item');
            renderAll();
        }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        /* ── FIRE ── */
        function doFire(shooter) {
            if (G.pointer >= CHAMBERS) { nextRound(); return; }
            const hit = G.chambers[G.pointer];
            const isPlayer = shooter === 'player';
            G.pointer++;

            if (hit) {
                showMuzzleFlash(true);
                if (isPlayer) {
                    if (G.shielded) {
                        G.shielded = false;
                        log('💥 中彈！——但護盾擋下了這一發！', 'safe');
                        flashScene('gold');
                    } else {
                        G.myLives--;
                        log(`💥 你中彈了！（-1命 | 命剩 ${G.myLives}）`, 'hit');
                        flashScene('red');
                        if (G.bet > 0) { log(`賭注 ${G.bet} 籌碼沒收。`, 'hit'); }
                        G.bet = 0; G.doubled = false;
                    }
                } else {
                    G.aiLives--;
                    log(`💥 莊家中彈！（-1命 | 命剩 ${G.aiLives}）`, 'ai');
                    flashScene('gold');
                    // AI loses bet too — pay player
                    const aiBet = calcAiBet();
                    if (aiBet > 0) {
                        G.myChips += aiBet; G.aiChips -= aiBet;
                        log(`莊家輸出 ${aiBet} 籌碼。`, 'ai');
                    }
                }
            } else {
                showMuzzleFlash(false);
                if (isPlayer) {
                    const won = G.doubled ? G.bet * 2 : G.bet;
                    log(`✔ 空包彈——你安全了！${won > 0 ? `贏得 ${won} 籌碼。` : ''}`, 'safe');
                    flashScene('gold');
                    if (won > 0) { G.myChips += won; G.aiChips -= won; }
                } else {
                    log('✔ 莊家開槍——空包彈。他面無表情。', 'ai');
                }
                G.bet = 0; G.doubled = false;
            }

            updateMood();
            renderAll();

            if (G.myLives <= 0) { endGame(false); return; }
            if (G.aiLives <= 0) { endGame(true); return; }
            if (G.myChips <= 0) { endGame(false); return; }
            if (G.aiChips <= 0) { endGame(true); return; }

            if (G.pointer >= CHAMBERS) { setTimeout(nextRound, 800); return; }

            if (isPlayer) {
                G.turn = 'ai';
                renderAll();
                setTimeout(aiTurn, 1400);
            } else {
                G.turn = 'player';
                renderAll();
            }
        }

        function playerFire() {
            if (G.turn !== 'player' || G.gameOver) return;
            doFire('player');
        }

        function playerPass() {
            if (G.turn !== 'player' || G.gameOver) return;
            log('你選擇傳遞——讓莊家先開槍。', 'sys');
            G.turn = 'ai';
            renderAll();
            setTimeout(aiTurn, 1200);
        }

        /* ── AI TURN ── */
        function calcAiBet() {
            const remaining = CHAMBERS - G.pointer;
            const loaded = G.chambers.slice(G.pointer).filter(Boolean).length;
            const pct = remaining > 0 ? loaded / remaining : 0;
            const base = Math.floor(G.aiChips * 0.15);
            return Math.min(base + Math.floor(Math.random() * 50), G.aiChips);
        }

        function aiTurn() {
            if (G.gameOver) return;
            const remaining = CHAMBERS - G.pointer;
            const loaded = G.chambers.slice(G.pointer).filter(Boolean).length;
            const pct = remaining > 0 ? loaded / remaining : 0;

            // AI uses peek if available and tension high
            if (G.aiItems.peek && pct > 0.4) {
                G.aiItems.peek = 0;
                log('莊家使用了窺探道具……', 'ai');
            }

            // AI decision: higher pct = more likely to pass back
            const fires = Math.random() > (pct * 0.7);
            if (fires) {
                const bet = calcAiBet();
                log(`莊家下注 ${bet} 籌碼，扣下扳機……`, 'ai');
                setTimeout(() => doFire('ai'), 600);
            } else {
                log('莊家面露不安——將槍推回給你。', 'ai');
                G.turn = 'player';
                renderAll();
            }
        }

        function nextRound() {
            G.round++;
            G.items = { peek: 1, spin: 1, skip: 1, double: 1, shield: 1 };
            loadGun();
            G.turn = 'player';
            renderAll();
        }

        /* ── VISUAL FX ── */
        function showMuzzleFlash(hit) {
            const f = document.getElementById('muzzleFlash');
            f.style.opacity = '1';
            f.style.transition = 'none';
            setTimeout(() => { f.style.transition = 'opacity 0.3s'; f.style.opacity = '0'; }, 150);
            if (hit) {
                const svg = document.getElementById('revolverSvg');
                svg.style.filter = 'drop-shadow(0 0 16px rgba(231,76,60,0.8))';
                setTimeout(() => svg.style.filter = 'drop-shadow(0 4px 24px rgba(0,0,0,0.8))', 400);
            }
        }

        function flashScene(type) {
            document.body.classList.remove('flash-red', 'flash-gold');
            void document.body.offsetWidth;
            document.body.classList.add(type === 'red' ? 'flash-red' : 'flash-gold');
            setTimeout(() => document.body.classList.remove('flash-red', 'flash-gold'), 500);
        }

        /* ── END ── */
        function endGame(won) {
            G.gameOver = true;
            renderAll();
            setTimeout(() => {
                document.getElementById('resultEyebrow').textContent = won ? 'VICTORY' : 'DEFEAT';
                document.getElementById('resultTitle').textContent = won ? '你贏了' : '你輸了';
                document.getElementById('resultTitle').className = 'modal-title ' + (won ? 'gold' : 'red');
                document.getElementById('resultSub').textContent = won ? '莊家的命運走到了盡頭' : '你倒下了——莊家冷笑收場';
                const diff = G.myChips - START;
                document.getElementById('resultStat').textContent = (diff >= 0 ? '+' : '') + diff + ' 籌碼';
                document.getElementById('resultModal').classList.add('show');
            }, 600);
        }

        function restart() {
            closeModal('resultModal');
            document.getElementById('logEl').innerHTML = '<div class="log-entry sys">— 新的一局開始。—</div>';
            init();
        }

        function log(msg, type) {
            const el = document.getElementById('logEl');
            const d = document.createElement('div');
            d.className = 'log-entry ' + (type || '');
            d.textContent = msg;
            el.appendChild(d);
            el.scrollTop = el.scrollHeight;
        }

        init();
    </script>
</body>

</html>
