<!DOCTYPE html>
<html lang="zh-TW">


<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>身分證字號驗證</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f0f0f;
            --surface: #181818;
            --surface2: #222;
            --border: #2e2e2e;
            --accent: #c8f542;
            --accent-dim: #a8d030;
            --text: #f0f0f0;
            --text-muted: #888;
            --success-bg: #1a2e0a;
            --success: #7ed321;
            --error-bg: #2e0a0a;
            --error: #e25454;
            --radius: 14px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }


        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .header {
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            background: rgba(200, 245, 66, 0.1);
            border: 1px solid rgba(200, 245, 66, 0.25);
            border-radius: 999px;
            padding: 3px 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            margin-bottom: 1rem;
        }

        .label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1.25rem;
        }

        #idInput {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 1rem;
            height: 52px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: border-color 0.2s;
            outline: none;
        }

        #idInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 245, 66, 0.12);
        }

        #idInput::placeholder {
            color: #444;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .btn-validate {
            height: 52px;
            padding: 0 1.4rem;
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            border-radius: 10px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-validate:hover {
            background: var(--accent-dim);
        }

        .btn-validate:active {
            transform: scale(0.97);
        }

        .btn-clear {
            height: 52px;
            padding: 0 1rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .btn-clear:hover {
            color: var(--text);
            border-color: #555;
        }

        .result-box {
            display: none;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 1.25rem;
            animation: fadeSlide 0.2s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box.success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--success-bg);
            border: 1px solid rgba(126, 211, 33, 0.3);
            color: var(--success);
        }

        .result-box.error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--error-bg);
            border: 1px solid rgba(226, 84, 84, 0.3);
            color: var(--error);
        }

        .result-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Breakdown section */
        .breakdown {
            display: none;
            gap: 8px;
        }

        .breakdown.show {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .stat {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-value.accent {
            color: var(--accent);
        }


        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.25rem 0;
        }


        .format-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.75rem;
        }

        .format-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .format-visual {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .seg {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .seg-box {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        .seg-box.alpha {
            background: rgba(200, 245, 66, 0.12);
            color: var(--accent);
            border: 1px solid rgba(200, 245, 66, 0.25);
        }

        .seg-box.gender {
            background: rgba(100, 180, 255, 0.1);
            color: #64b4ff;
            border: 1px solid rgba(100, 180, 255, 0.25);
        }

        .seg-box.digit {
            background: var(--surface2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .seg-box.check {
            background: rgba(200, 245, 66, 0.06);
            color: var(--accent-dim);
            border: 1px dashed rgba(200, 245, 66, 0.3);
        }

        .seg-hint {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0;
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.alpha {
            background: var(--accent);
        }

        .dot.gender {
            background: #64b4ff;
        }

        .dot.digit {
            background: #555;
        }

        .dot.check {
            background: var(--accent-dim);
        }


        .history-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.75rem;
            margin-top: 1rem;
            display: none;
        }

        .history-card.show {
            display: block;
        }

        .history-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
            border-radius: 8px;
            padding: 0.5rem 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        .history-id {
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text);
        }

        .history-ok {
            font-size: 12px;
            color: var(--success);
        }

        .history-fail {
            font-size: 12px;
            color: var(--error);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: color 0.15s, border-color 0.15s;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="badge">Taiwan ROC</div>
            <h1>身分證字號<span>驗證</span></h1>
            <p class="subtitle">ROC National ID Validator — 格式與檢查碼驗證</p>
        </div>

        <div class="card">
            <div class="label">輸入身分證字號</div>
            <div class="input-row">
                <input type="text" id="idInput" maxlength="10" placeholder="A123456789"
                    oninput="this.value=this.value.toUpperCase()" />
                <button class="btn-validate" onclick="validate()">驗證</button>
                <button class="btn-clear" onclick="reset()">清除</button>
            </div>

            <div class="result-box" id="resultBox">
                <svg class="result-icon" id="resultIcon" viewBox="0 0 20 20" fill="currentColor"></svg>
                <span id="resultText"></span>
            </div>

            <div class="breakdown" id="breakdown">
                <div class="stat">
                    <div class="stat-label">字首字母值</div>
                    <div class="stat-value accent" id="statLetter">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">性別碼</div>
                    <div class="stat-value" id="statGender">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">加權總和</div>
                    <div class="stat-value" id="statSum">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">總和 mod 10</div>
                    <div class="stat-value" id="statMod">—</div>
                </div>
            </div>
        </div>

        <div class="format-card">
            <div class="format-title">格式說明</div>
            <div class="format-visual">
                <div class="seg">
                    <div class="seg-box alpha">A</div>
                    <div class="seg-hint">縣市</div>
                </div>
                <div class="seg">
                    <div class="seg-box gender">1</div>
                    <div class="seg-hint">性別</div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">2</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">3</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">4</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">5</div>
                    <div class="seg-hint">序號</div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">6</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">7</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box digit">8</div>
                    <div class="seg-hint"></div>
                </div>
                <div class="seg">
                    <div class="seg-box check">9</div>
                    <div class="seg-hint">檢查碼</div>
                </div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="dot alpha"></div>縣市代碼
                </div>
                <div class="legend-item">
                    <div class="dot gender"></div>1=男 2=女
                </div>
                <div class="legend-item">
                    <div class="dot digit"></div>序號
                </div>
                <div class="legend-item">
                    <div class="dot check"></div>檢查碼
                </div>
            </div>
        </div>

        <div class="history-card" id="historyCard">
            <div class="history-title">驗證紀錄</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const letterMap = {
            A: 10, B: 11, C: 12, D: 13, E: 14, F: 15, G: 16, H: 17, I: 34,
            J: 18, K: 19, L: 20, M: 21, N: 22, O: 35, P: 23, Q: 24, R: 25,
            S: 26, T: 27, U: 28, V: 29, W: 32, X: 30, Y: 31, Z: 33
        };

        const history = [];

        function validateID(id) {
            if (!id || id.length !== 10) return { valid: false };

            const first = id[0].toUpperCase();
            if (!(first in letterMap)) return { valid: false };

            const lv = letterMap[first];
            let sum = Math.floor(lv / 10) + (lv % 10) * 9;

            if (id[1] !== '1' && id[1] !== '2') return { valid: false };

            for (let i = 1; i < 10; i++) {
                if (!/\d/.test(id[i])) return { valid: false };
            }

            const weights = [8, 7, 6, 5, 4, 3, 2, 1];
            for (let i = 1; i <= 8; i++) sum += parseInt(id[i]) * weights[i - 1];
            sum += parseInt(id[9]);

            return {
                valid: sum % 10 === 0,
                letterValue: lv,
                gender: id[1] === '1' ? '男性 (1)' : '女性 (2)',
                sum: sum,
                mod: sum % 10
            };
        }

        function validate() {
            const id = document.getElementById('idInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const resultIcon = document.getElementById('resultIcon');
            const breakdown = document.getElementById('breakdown');

            const res = validateID(id);

            if (res.valid) {
                resultBox.className = 'result-box success';
                resultText.textContent = '驗證成功，身分證字號正確！';
                resultIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>';
            } else {
                resultBox.className = 'result-box error';
                resultText.textContent = id.length === 0 ? '請輸入身分證字號' : '驗證失敗，格式或檢查碼錯誤！';
                resultIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>';
            }

            if (res.letterValue !== undefined) {
                breakdown.className = 'breakdown show';
                document.getElementById('statLetter').textContent = res.letterValue;
                document.getElementById('statGender').textContent = res.gender;
                document.getElementById('statSum').textContent = res.sum;
                document.getElementById('statMod').textContent = res.mod;
            } else {
                breakdown.className = 'breakdown';
            }

            if (id.length > 0) {
                history.unshift({ id, valid: res.valid });
                if (history.length > 5) history.pop();
                renderHistory();
            }
        }

        function reset() {
            document.getElementById('idInput').value = '';
            document.getElementById('resultBox').className = 'result-box';
            document.getElementById('breakdown').className = 'breakdown';
        }

        function renderHistory() {
            const card = document.getElementById('historyCard');
            const list = document.getElementById('historyList');
            card.className = 'history-card show';
            list.innerHTML = history.map(h => `
    <div class="history-item">
      <span class="history-id">${h.id}</span>
      <span class="${h.valid ? 'history-ok' : 'history-fail'}">${h.valid ? '✓ 正確' : '✗ 錯誤'}</span>
    </div>
  `).join('');
        }

        document.getElementById('idInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') validate();
        });
    </script>
    <div class="back"><button onclick="window.location.href='/c_list'">回去</button></div>

</body>

</html>
